name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Ubuntu's own ffmpeg is 6.x, and the pre-started decoders need 7 or newer. The
      # johnvansickle 7.0.2 build's ffprobe crashes on MPEG-TS; BtbN's track each release.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # Windows checkouts turn line endings into CRLF, which gofmt would report everywhere.
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      # The release cross-compiles; every target must build.
      - name: Build every release target
        if: runner.os == 'Linux'
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done
